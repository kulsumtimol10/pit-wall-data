# Publishes out/ to GitHub Pages whenever data changes on main. The weekly
# update (weekly-data.yml) calls it after committing new sessions.
name: Deploy data to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['out/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The weekly update calls this right after pushing to main.
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v5
